<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Photographer International</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ثيم الخلفية الفخم */
        body { 
            background: radial-gradient(circle at top right, #1a1a1a, #000000);
            background-attachment: fixed;
            color: #ffffff; 
            font-family: 'Cairo', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 450px; 
            margin: auto; 
            border: 1px solid rgba(212, 175, 55, 0.2); 
            padding: 25px; 
            border-radius: 30px; 
            background: rgba(15, 15, 15, 0.8); 
            backdrop-filter: blur(10px); /* تأثير الزجاج */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }

        /* تنسيق صورة البروفايل الفردية الفخمة */
        .profile-area { position: relative; margin-bottom: 20px; margin-top: 10px; }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            padding: 5px;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            display: inline-block;
        }

        h1 { color: #d4af37; font-size: 22px; margin: 15px 0 5px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        
        /* الرسالة الترحيبية الشيك */
        .welcome-message { 
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #f0e6d2;
            font-style: italic;
        }
