<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: #ffffff; font-family: 'Cairo', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: auto; border: 1px solid #222; padding: 20px; border-radius: 20px; background: #0f0f0f; }
        .logo img { width: 150px; height: auto; margin-bottom: 10px; border-radius: 10px; }
        h1 { color: #d4af37; font-size: 24px; margin: 10px 0; }
        .section-title { text-align: right; color: #d4af37; border-right: 3px solid #d4af37; padding-right: 10px; margin: 25px 0 15px 0; font-size: 18px; }
        .package { background: #1a1a1a; border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .price { background: #d4af37; color: #000; padding: 8px 12px; border-radius: 10px; font-weight: bold; }
        .btn { display: block; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        .btn-whatsapp { background: #d4af37; color: #000; }
        .btn-call { background: transparent; color: #fff; border: 1px solid #fff; }
        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .social-item { background: #1a1a1a; padding: 10px; border-radius: 10px; text-decoration: none; color: #fff; font-size: 12px; border: 1px solid #222; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img src="logo.jpg" alt="Diamond Studio">
    </div>

    <h1>DIAMOND STUDIO</h1>
    <p style="color: #888;">Professional Photographer</p>

    <div class="section-title">الباقات المتاحة</div>
    <div class="package">
        <div style="text-align: right;">
            <strong>باقة (سيشن + بارتي + ألبوم)</strong>
            <p style="margin:5px 0; color:#aaa; font-size:12px;">تصوير احترافي متكامل</p>
        </div>
        <div class="price">5000 EGP</div>
    </div>

    <div class="section-title">الحجز والاستعلام</div>
    <a href="https://wa.me/201505827390?text=حابب أستفسر عن حجز باقة Diamond Studio" class="btn btn-whatsapp">تأكيد الحجز عبر واتساب</a>
    <a href="tel:+201505827390" class="btn btn-call">اتصل بنا هاتفياً</a>

    <div class="section-title">تابعنا على</div>
    <div class="social-grid">
        <a href="https://www.facebook.com/profile.php?id=61568555212856" class="social-item">فيسبوك</a>
        <a href="https://www.instagram.com/diamondstudio2026" class="social-item">إنستجرام</a>
        <a href="https://www.tiktok.com/@diamondstudio40" class="social-item">تيك توك</a>
    </div>
</div>

</body>
</html>
